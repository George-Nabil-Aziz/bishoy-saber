# Pings Supabase every 3 days so the free project is not paused for inactivity.
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # The tables are closed to the anon key, so ping the Auth health endpoint (needs only the key)
          curl -sf "https://kvnvyxpnaogekbmelnug.supabase.co/auth/v1/health" \
            -H "apikey: sb_publishable_16L7jf6nP8n3a8twcv_bMQ_04YZALky"
