<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme/lang before paint to avoid a flash
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        if (theme) document.documentElement.dataset.theme = theme;
        const lang = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <template id="togglesTpl">
    <div class="toggles">
      <button type="button" class="toggle" data-action="lang"></button>
      <button type="button" class="toggle" data-action="theme" aria-label="Theme"></button>
    </div>
  </template>

  <!-- ================= Landing ================= -->
  <div id="landing" class="hidden">
    <header class="nav">
      <div class="logo">✎</div>
      <span class="brand-name" data-i18n="appName"></span>
      <div data-toggles></div>
      <a class="btn" data-enter href="#/login"></a>
    </header>

    <section class="hero">
      <div class="pill">✨ <span data-i18n="heroPill"></span></div>
      <h2><span data-i18n="heroTitle1"></span><br /><span class="gradient-text" data-i18n="heroTitle2"></span></h2>
      <p data-i18n="heroText"></p>
      <div class="actions">
        <a class="btn" data-enter href="#/login"></a>
        <a class="btn ghost" href="#features" data-i18n="learnMore"></a>
      </div>

      <div class="preview" aria-hidden="true">
        <div class="preview-inner">
          <div class="preview-row"><span class="dot c1"></span><span class="bar" style="width:45%"></span><span class="num">1,250</span></div>
          <div class="preview-row"><span class="dot c2"></span><span class="bar" style="width:62%"></span><span class="num">87</span></div>
          <div class="preview-row"><span class="dot c3"></span><span class="bar" style="width:35%"></span><span class="num">3,400</span></div>
          <div class="preview-row"><span class="dot c4"></span><span class="bar" style="width:52%"></span><span class="num">512</span></div>
        </div>
      </div>
    </section>

    <h2 class="section-title" id="features" data-i18n="featuresTitle"></h2>
    <p class="section-sub" data-i18n="featuresSub"></p>
    <div class="features">
      <div class="feature"><div class="icon c1" data-icon="bolt"></div><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
      <div class="feature"><div class="icon c2" data-icon="cloud"></div><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
      <div class="feature"><div class="icon c3" data-icon="edit"></div><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
      <div class="feature"><div class="icon c4" data-icon="globe"></div><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
      <div class="feature"><div class="icon c5" data-icon="moon"></div><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></div>
      <div class="feature"><div class="icon c6" data-icon="phone"></div><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></div>
    </div>

    <h2 class="section-title" data-i18n="stepsTitle"></h2>
    <p class="section-sub" data-i18n="stepsSub"></p>
    <div class="steps">
      <div class="step"><div class="n c1">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
      <div class="step"><div class="n c2">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
      <div class="step"><div class="n c3">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
    </div>

    <section class="cta">
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaText"></p>
      <a class="btn" data-enter href="#/login"></a>
    </section>

    <footer>© <span id="year"></span> · <span data-i18n="appName"></span> · <span data-i18n="footer"></span></footer>
  </div>

  <!-- ================= Login ================= -->
  <div id="login" class="hidden">
    <div class="login-top">
      <a class="back" href="#/"><span class="flip" data-icon="back"></span><span data-i18n="backHome"></span></a>
      <div data-toggles></div>
    </div>
    <div class="brand">
      <div class="logo">✎</div>
      <h1 data-i18n="appName"></h1>
      <p data-i18n="welcome"></p>
    </div>
    <div class="card">
      <form id="loginForm">
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" required dir="ltr" />
        <label for="password" data-i18n="password"></label>
        <input id="password" type="password" required dir="ltr" />
        <button type="submit" class="btn block" data-i18n="login"></button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </div>

    <div class="persona-title"><span class="badge demo" data-i18n="demoBadge"></span> <span data-i18n="personaHint"></span></div>
    <div class="personas" id="personas"></div>
  </div>

  <template id="userFormTpl">
    <form class="user-form" autocomplete="off">
      <div>
        <label data-for="name" class="req" data-i18n="uName"></label>
        <input data-f="name" type="text" required />
      </div>
      <div>
        <label data-for="email" class="req" data-i18n="email"></label>
        <input data-f="email" type="email" required dir="ltr" autocomplete="off" />
      </div>
      <div class="full">
        <label data-for="password" data-f="pwLabel" data-i18n="password"></label>
        <input data-f="password" type="password" minlength="6" dir="ltr" autocomplete="new-password" />
        <small class="field-hint hidden" data-f="pwHint" data-i18n="pwKeep"></small>
      </div>
      <div class="full" data-f="roleBox">
        <label data-for="role" class="req" data-i18n="role"></label>
        <select data-f="role">
          <option value="user" data-i18n="roleUser"></option>
          <option value="admin" data-i18n="roleAdmin"></option>
        </select>
      </div>
      <div class="full photo-pick">
        <label data-for="photo" class="photo-circle" data-f="preview" data-i18n-title="choosePhoto"></label>
        <input data-f="photo" type="file" accept="image/*" hidden />
        <div>
          <label data-for="photo" class="photo-btn" data-i18n="choosePhoto"></label>
          <small data-i18n="photoOptional"></small>
        </div>
      </div>
      <div class="full form-actions">
        <button type="submit" class="btn" data-f="btn"></button>
        <a class="btn ghost" data-f="cancel" href="#/users" data-i18n="cancel"></a>
      </div>
      <div class="full"><div class="msg" data-f="msg"></div></div>
    </form>
  </template>

  <!-- ================= App ================= -->
  <div id="app" class="hidden">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" data-i18n-title="menu" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
      <div class="logo">✎</div>
      <span class="brand-name" data-i18n="appName"></span>
      <span class="conn-dot" data-i18n-title="conn_online" id="connDotTop"></span>
      <div data-toggles></div>
      <button type="button" class="signout" id="signout" data-i18n-title="signout"><span class="flip" data-icon="logout"></span><span class="nav-label" data-i18n="signout"></span></button>
    </header>

    <div class="app-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside id="sidebar">
      <div class="who-block">
        <div class="who"><span class="avatar" id="whoInitial"></span><span id="whoName"></span></div>
        <div class="conn"><span class="conn-dot"></span><span id="connText"></span></div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <main>
      <!-- Notes table -->
      <div id="notes" class="card wide">
        <div class="page-head">
          <h1 data-i18n="notes"></h1>
          <a class="btn" id="addNoteBtn" href="#/notes/new"><span data-icon="plus"></span><span data-i18n="addNote"></span></a>
        </div>
        <div id="notesTable"></div>
        <div id="notesMsg" class="msg"></div>
      </div>

      <!-- Add / Edit note -->
      <div id="editor" class="card hidden">
        <h1 id="editorTitle"></h1>
        <form id="form">
          <label for="title" class="req" data-i18n="fTitle"></label>
          <input id="title" name="title" type="text" required />

          <label for="amount" data-i18n="fAmount"></label>
          <input id="amount" name="amount" type="number" step="any" />

          <label for="notesText" data-i18n="fNotes"></label>
          <textarea id="notesText" name="notes"></textarea>

          <label for="noteImage" data-i18n="fImage"></label>
          <input id="noteImage" type="file" accept="image/*" hidden />
          <label for="noteImage" class="image-drop" id="noteImageDrop">
            <span data-icon="image"></span><span data-i18n="addImage"></span>
          </label>
          <div class="image-preview hidden" id="noteImagePreview">
            <img id="noteImageImg" alt="" />
            <button type="button" class="icon-btn del" id="noteImageRemove" data-i18n-title="removeImage" data-icon="trash"></button>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn" id="save" data-i18n="save"></button>
            <a class="btn ghost" href="#/notes" data-i18n="cancel"></a>
          </div>
          <div id="msg" class="msg"></div>
        </form>
      </div>

      <!-- View (read-only) -->
      <div id="viewer" class="card hidden">
        <div id="viewBody" class="hidden">
          <div class="view-head">
            <h1 id="vTitle"></h1>
            <span class="date" id="vDate"></span>
          </div>
          <div class="view-label" data-i18n="fAmount"></div>
          <div class="view-num" id="vAmount" dir="ltr"></div>
          <div class="view-label" data-i18n="fNotes"></div>
          <div class="view-notes" id="vNotes"></div>
          <div class="view-label" data-i18n="createdBy"></div>
          <div id="vBy"></div>
          <div class="view-label" data-i18n="editedBy"></div>
          <div id="vEditedBy"></div>
          <a class="view-image hidden" id="vImageLink" target="_blank" rel="noopener"><img id="vImage" alt="" /></a>
          <div class="view-actions">
            <a class="btn ghost" href="#/notes"><span class="flip" data-icon="back"></span><span data-i18n="notes"></span></a>
            <a class="btn hidden" id="vEdit"><span data-icon="edit"></span><span data-i18n="editBtn"></span></a>
          </div>
        </div>
        <div id="viewMsg" class="msg"></div>
      </div>

      <!-- Users table -->
      <div id="users" class="card wide hidden">
        <div class="page-head">
          <h1 data-i18n="users"></h1>
          <a class="btn" href="#/users/new"><span data-icon="plus"></span><span data-i18n="addUser"></span></a>
        </div>
        <div id="usersTable"></div>
        <div id="usersMsg" class="msg"></div>
      </div>

      <!-- Add / edit user -->
      <div id="userEditor" class="card hidden">
        <h1 id="userEditorTitle"></h1>
        <div id="userFormHost"></div>
      </div>

      <!-- History (audit log) -->
      <div id="history" class="card wide hidden">
        <div class="page-head"><h1 data-i18n="history"></h1></div>
        <div class="filters">
          <select id="fUser"></select>
          <select id="fAction"></select>
        </div>
        <div id="historyTable"></div>
        <div id="historyMsg" class="msg"></div>
      </div>

      <!-- Sync -->
      <div id="sync" class="card wide hidden">
        <div class="page-head"><h1 data-i18n="sync"></h1></div>
        <div class="sync-actions">
          <button type="button" class="btn" id="syncNowBtn"><span data-icon="sync"></span><span data-i18n="syncNow"></span></button>
          <button type="button" class="btn ghost" id="checkBtn"><span data-icon="list"></span><span data-i18n="checkChanges"></span></button>
        </div>
        <h2 class="sub-title" data-i18n="pendingChanges"></h2>
        <div id="pendingBox"></div>
        <h2 class="sub-title" data-i18n="conflicts"></h2>
        <div id="conflictBox"></div>
        <div id="syncMsg" class="msg"></div>
      </div>

      <!-- Install app -->
      <div id="install" class="card hidden">
        <div class="page-head"><h1 data-i18n="install"></h1></div>
        <div class="install-section">
          <img src="icons/icon-192.png" alt="" />
          <div class="install-text">
            <strong data-i18n="installTitle"></strong>
            <p id="installState"></p>
          </div>
          <button type="button" class="btn" id="installBtn2"><span data-icon="download"></span><span data-i18n="installBtn"></span></button>
        </div>
      </div>

      <!-- Profile -->
      <div id="profile" class="card hidden">
        <div class="profile-head">
          <span class="avatar" id="pAvatar"></span>
          <div><h1 id="pName"></h1><small id="pEmail"></small><span class="badge" id="pRole"></span></div>
        </div>
        <div id="profileFormHost"></div>
      </div>

      <!-- What's new -->
      <div id="whatsNew" class="card hidden">
        <h1 data-i18n="whatsNew"></h1>
        <ul class="timeline" id="newsList"></ul>
      </div>
    </main>
    </div>
  </div>

  <div id="installBar" class="install-bar hidden">
    <img src="icons/icon-192.png" alt="" />
    <div class="install-text">
      <strong data-i18n="installTitle"></strong>
      <small id="installHint"></small>
    </div>
    <button type="button" class="btn" id="installBtn" data-i18n="installBtn"></button>
    <button type="button" class="install-close" id="installClose" aria-label="Close">✕</button>
  </div>

  <div id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/users.js"></script>
  <script src="js/history.js"></script>
  <script src="js/sync-page.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
