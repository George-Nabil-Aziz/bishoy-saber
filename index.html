<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme/lang before paint to avoid a flash
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        if (theme) document.documentElement.dataset.theme = theme;
        const lang = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <template id="togglesTpl">
    <div class="toggles">
      <button type="button" class="toggle" data-action="lang"></button>
      <button type="button" class="toggle" data-action="theme" aria-label="Theme"></button>
    </div>
  </template>

  <!-- ================= Landing ================= -->
  <div id="landing" class="hidden">
    <header class="nav">
      <div class="logo">✎</div>
      <span class="brand-name" data-i18n="appName"></span>
      <div data-toggles></div>
      <a class="btn" data-enter href="#/login"></a>
    </header>

    <section class="hero">
      <div class="pill">✨ <span data-i18n="heroPill"></span></div>
      <h2><span data-i18n="heroTitle1"></span><br /><span class="gradient-text" data-i18n="heroTitle2"></span></h2>
      <p data-i18n="heroText"></p>
      <div class="actions">
        <a class="btn" data-enter href="#/login"></a>
        <a class="btn ghost" href="#features" data-i18n="learnMore"></a>
      </div>

      <div class="preview" aria-hidden="true">
        <div class="preview-inner">
          <div class="preview-row"><span class="dot c1"></span><span class="bar" style="width:45%"></span><span class="num">1,250</span></div>
          <div class="preview-row"><span class="dot c2"></span><span class="bar" style="width:62%"></span><span class="num">87</span></div>
          <div class="preview-row"><span class="dot c3"></span><span class="bar" style="width:35%"></span><span class="num">3,400</span></div>
          <div class="preview-row"><span class="dot c4"></span><span class="bar" style="width:52%"></span><span class="num">512</span></div>
        </div>
      </div>
    </section>

    <h2 class="section-title" id="features" data-i18n="featuresTitle"></h2>
    <p class="section-sub" data-i18n="featuresSub"></p>
    <div class="features">
      <div class="feature"><div class="icon c1" data-icon="bolt"></div><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
      <div class="feature"><div class="icon c2" data-icon="cloud"></div><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
      <div class="feature"><div class="icon c3" data-icon="edit"></div><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
      <div class="feature"><div class="icon c4" data-icon="globe"></div><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
      <div class="feature"><div class="icon c5" data-icon="moon"></div><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></div>
      <div class="feature"><div class="icon c6" data-icon="phone"></div><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></div>
    </div>

    <h2 class="section-title" data-i18n="stepsTitle"></h2>
    <p class="section-sub" data-i18n="stepsSub"></p>
    <div class="steps">
      <div class="step"><div class="n c1">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
      <div class="step"><div class="n c2">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
      <div class="step"><div class="n c3">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
    </div>

    <section class="cta">
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaText"></p>
      <a class="btn" data-enter href="#/login"></a>
    </section>

    <footer>© <span id="year"></span> · <span data-i18n="appName"></span> · <span data-i18n="footer"></span></footer>
  </div>

  <!-- ================= Login ================= -->
  <div id="login" class="hidden">
    <div class="login-top">
      <a class="back" href="#/"><span class="flip" data-icon="back"></span><span data-i18n="backHome"></span></a>
      <div data-toggles></div>
    </div>
    <div class="brand">
      <div class="logo">✎</div>
      <h1 data-i18n="appName"></h1>
      <p data-i18n="welcome"></p>
    </div>
    <div class="card">
      <form id="loginForm">
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" required dir="ltr" />
        <label for="password" data-i18n="password"></label>
        <input id="password" type="password" required dir="ltr" />
        <button type="submit" class="btn block" data-i18n="login"></button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </div>

    <div class="persona-title" data-i18n="personaHint"></div>
    <button type="button" class="persona" id="persona">
      <span class="avatar" data-i18n="initial"></span>
      <span>
        <strong data-i18n="userName"></strong>
        <small>bishoy.saber@gmail.com</small>
      </span>
    </button>
  </div>

  <!-- ================= App ================= -->
  <div id="app" class="hidden">
    <aside>
      <div class="who"><span class="avatar" id="whoInitial"></span><span id="whoName"></span></div>
      <nav>
        <a href="#/add" data-nav="add"><span data-icon="plus"></span><span data-i18n="addNote"></span></a>
        <a href="#/history" data-nav="history"><span data-icon="list"></span><span data-i18n="history"></span></a>
        <a href="#/users" data-nav="users"><span data-icon="users"></span><span data-i18n="users"></span></a>
      </nav>
      <div class="aside-bottom">
        <div data-toggles></div>
        <button type="button" class="signout" id="signout" data-i18n-title="signout"><span class="flip" data-icon="logout"></span><span data-i18n="signout"></span></button>
      </div>
    </aside>

    <main>
      <!-- Add / Edit -->
      <div id="editor" class="card">
        <h1 id="editorTitle"></h1>
        <form id="form">
          <label for="title" class="req" data-i18n="fTitle"></label>
          <input id="title" name="title" type="text" required />

          <label for="amount" class="req" data-i18n="fAmount"></label>
          <input id="amount" name="amount" type="number" step="any" required />

          <label for="notes" data-i18n="fNotes"></label>
          <textarea id="notes" name="notes"></textarea>

          <label for="noteImage" data-i18n="fImage"></label>
          <input id="noteImage" type="file" accept="image/*" hidden />
          <label for="noteImage" class="image-drop" id="noteImageDrop">
            <span data-icon="image"></span><span data-i18n="addImage"></span>
          </label>
          <div class="image-preview hidden" id="noteImagePreview">
            <img id="noteImageImg" alt="" />
            <button type="button" class="icon-btn del" id="noteImageRemove" data-i18n-title="removeImage" data-icon="trash"></button>
          </div>

          <button type="submit" class="btn block" id="save" data-i18n="save"></button>
          <div id="msg" class="msg"></div>
        </form>
      </div>

      <!-- View (read-only) -->
      <div id="viewer" class="card hidden">
        <div id="viewBody" class="hidden">
          <div class="view-head">
            <h1 id="vTitle"></h1>
            <span class="date" id="vDate"></span>
          </div>
          <div class="view-label" data-i18n="fAmount"></div>
          <div class="view-num" id="vAmount" dir="ltr"></div>
          <div class="view-label" data-i18n="fNotes"></div>
          <div class="view-notes" id="vNotes"></div>
          <a class="view-image hidden" id="vImageLink" target="_blank" rel="noopener"><img id="vImage" alt="" /></a>
          <div class="view-actions">
            <a class="btn ghost" href="#/history"><span class="flip" data-icon="back"></span><span data-i18n="history"></span></a>
            <a class="btn" id="vEdit"><span data-icon="edit"></span><span data-i18n="editBtn"></span></a>
          </div>
        </div>
        <div id="viewMsg" class="msg"></div>
      </div>

      <!-- History -->
      <div id="history" class="card hidden">
        <h1 data-i18n="history"></h1>
        <ul id="list"></ul>
        <div id="historyMsg" class="msg"></div>
      </div>

      <!-- Users -->
      <div id="users" class="card hidden">
        <h1 data-i18n="users"></h1>
        <h2 class="sub-title form-title" id="userFormTitle"></h2>
        <form id="userForm" class="user-form" autocomplete="off">
          <div>
            <label for="uName" class="req" data-i18n="uName"></label>
            <input id="uName" type="text" required />
          </div>
          <div>
            <label for="uEmail" class="req" data-i18n="email"></label>
            <input id="uEmail" type="email" required dir="ltr" autocomplete="off" />
          </div>
          <div class="full">
            <label for="uPassword" id="uPasswordLabel" data-i18n="password"></label>
            <input id="uPassword" type="password" required minlength="6" dir="ltr" autocomplete="new-password" />
            <small class="field-hint hidden" id="pwHint" data-i18n="pwKeep"></small>
          </div>
          <div class="full photo-pick">
            <label for="uPhoto" class="photo-circle" id="uPreview" data-i18n-title="choosePhoto"></label>
            <input id="uPhoto" type="file" accept="image/*" hidden />
            <div>
              <label for="uPhoto" class="photo-btn" data-i18n="choosePhoto"></label>
              <small data-i18n="photoOptional"></small>
            </div>
          </div>
          <div class="full form-actions">
            <button type="submit" class="btn" id="addUserBtn"></button>
            <button type="button" class="btn ghost hidden" id="cancelEditUser" data-i18n="cancel"></button>
          </div>
          <div class="full">
            <div id="userMsg" class="msg"></div>
          </div>
        </form>

        <h2 class="sub-title" data-i18n="allUsers"></h2>
        <div id="userList"></div>
      </div>
    </main>
  </div>

    let lang = store.get('lang') === 'en' ? 'en' : 'ar';
    const t = (key) => I18N[lang][key];

    function applyLang() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t('appName');
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
      document.querySelectorAll('[data-nav]').forEach((a) => { a.title = t(a.dataset.nav === 'add' ? 'addNote' : a.dataset.nav); });
      document.querySelectorAll('[data-action="lang"]').forEach((b) => { b.textContent = t('otherLang'); });
      document.querySelectorAll('[data-enter]').forEach((a) => { a.textContent = t(isLoggedIn() ? 'openApp' : 'startNow'); });
      document.querySelectorAll('.pw-eye').forEach(syncEye);
      $('editorTitle').textContent = t(editingId ? 'editTitle' : 'addTitle');
      updateWho();
      syncUserForm();
      if ($('app').classList.contains('hidden')) return;
      if (!$('history').classList.contains('hidden')) loadHistory();
      if (!$('viewer').classList.contains('hidden')) render();
      if (!$('users').classList.contains('hidden')) loadUsers();
    }

    // ---------- Password eye ----------
    function syncEye(btn) {
      const shown = btn.previousElementSibling.type === 'text';
      btn.innerHTML = shown ? ICONS.eyeOff : ICONS.eye;
      btn.title = t(shown ? 'hidePw' : 'showPw');
      btn.setAttribute('aria-label', btn.title);
    }
    document.querySelectorAll('input[type="password"]').forEach((input) => {
      const wrap = document.createElement('div');
      wrap.className = 'pw-wrap';
      input.replaceWith(wrap);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-eye';
      btn.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        syncEye(btn);
      });
      wrap.append(input, btn);
    });

    // ---------- Theme ----------
    const isDark = () => {
      const set = document.documentElement.dataset.theme;
      return set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    };
    function applyTheme() {
      document.querySelectorAll('[data-action="theme"]').forEach((b) => { b.innerHTML = isDark() ? ICONS.sun : ICONS.moon; });
    }

    // Mount toggles + static icons
    document.querySelectorAll('[data-toggles]').forEach((slot) => slot.replaceWith($('togglesTpl').content.cloneNode(true)));
    document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = ICONS[el.dataset.icon]; });
    $('year').textContent = new Date().getFullYear();

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'lang') {
        lang = lang === 'ar' ? 'en' : 'ar';
        store.set('lang', lang);
        applyLang();
      } else if (btn.dataset.action === 'theme') {
        const next = isDark() ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        store.set('theme', next);
        applyTheme();
      }
    });

    // ---------- Login ----------
    const isLoggedIn = () => store.get('loggedIn') === '1';

    // Logged-in user as { name, email }; older sessions without it are the owner
    function currentUser() {
      try { return JSON.parse(store.get('user')) || { email: USER.email }; } catch { return { email: USER.email }; }
    }
    const isOwner = (email) => email.toLowerCase() === USER.email;
    // The owner's default name is translated; a renamed owner shows the new name
    const displayName = (u) => (isOwner(u.email) && (!u.name || u.name === 'Bishoy Saber') ? t('userName') : u.name || u.email);

    // Shows the user's photo inside an .avatar element, or their first letter
    function fillAvatar(el, u) {
      el.textContent = '';
      if (u.avatar_url) {
        const img = document.createElement('img');
        img.src = u.avatar_url;
        img.alt = '';
        el.append(img);
      } else {
        el.textContent = displayName(u).charAt(0).toUpperCase();
      }
    }

    function updateWho() {
      const u = currentUser();
      $('whoName').textContent = displayName(u);
      fillAvatar($('whoInitial'), u);
    }

    $('persona').addEventListener('click', () => {
      $('email').value = USER.email;
      $('password').value = USER.password;
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      const btn = e.submitter;
      btn.disabled = true;

      const { data, error } = await db.from('users').select('name, email, avatar_url')
        .eq('email', email).eq('password', password).maybeSingle();
      btn.disabled = false;

      // Owner can still sign in with the default password if the users table is unreachable
      const user = data || (error && email === USER.email && password === USER.password ? { email } : null);
      if (user) {
        store.set('loggedIn', '1');
        store.set('user', JSON.stringify(user));
        $('loginMsg').textContent = '';
        updateWho();
        location.hash = '#/add';
      } else {
        $('loginMsg').textContent = error ? t('error') + error.message : t('badLogin');
        $('loginMsg').className = 'msg err';
      }
    });

    $('signout').addEventListener('click', () => {
      store.del('loggedIn');
      store.del('user');
      $('loginForm').reset();
      location.hash = '#/';
    });

    // ---------- Routing: #/ (landing), #/login, #/add, #/history, #/edit/<id>, #/users ----------
    let editingId = null;

    function show(view) {
      for (const v of ['landing', 'login', 'app']) $(v).classList.toggle('hidden', v !== view);
      window.scrollTo(0, 0);
      document.querySelector('main').scrollTop = 0; // the app's content scrolls inside <main>
    }

    function render() {
      const [, page, id] = location.hash.split('/');
      const loggedIn = isLoggedIn();
      document.querySelectorAll('[data-enter]').forEach((a) => {
        a.href = loggedIn ? '#/add' : '#/login';
        a.textContent = t(loggedIn ? 'openApp' : 'startNow');
      });

      if (!page) return show('landing');
      if (page === 'login') return loggedIn ? (location.hash = '#/add') : show('login');
      if (!loggedIn) return (location.hash = '#/login');

      show('app');
      const section = page === 'history' || page === 'users' ? page : page === 'view' && id ? 'viewer' : 'editor';
      for (const s of ['editor', 'viewer', 'history', 'users']) $(s).classList.toggle('hidden', s !== section);
      const activeNav = page === 'edit' || page === 'view' ? 'history' : section === 'editor' ? 'add' : section;
      document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === activeNav));

      if (section === 'history') loadHistory();
      else if (section === 'users') loadUsers();
      else if (section === 'viewer') openView(id);
      else if (page === 'edit' && id) openEdit(id);
      else openAdd();
    }

    window.addEventListener('hashchange', (e) => {
      // In-page anchor links like #features: scroll, don't route
      if (location.hash && !location.hash.startsWith('#/')) {
        const target = document.querySelector(location.hash);
        history.replaceState(null, '', new URL(e.oldURL).hash || '#/');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      render();
    });

    // ---------- Add / Edit ----------
    const form = $('form');

    function setMsg(text, cls = '') { $('msg').textContent = text; $('msg').className = 'msg ' + cls; }

    // Note image state: the saved URL, a newly picked file, or a request to remove it
    const noteImage = { url: null, file: null, cleared: false };

    function showNoteImage(src) {
      $('noteImagePreview').classList.toggle('hidden', !src);
      $('noteImageDrop').classList.toggle('hidden', !!src);
      if (src) $('noteImageImg').src = src;
    }

    function resetNoteImage(url = null) {
      Object.assign(noteImage, { url, file: null, cleared: false });
      $('noteImage').value = '';
      showNoteImage(url);
    }

    $('noteImage').addEventListener('change', () => {
      const file = $('noteImage').files[0];
      if (!file) return;
      noteImage.file = file;
      showNoteImage(URL.createObjectURL(file));
    });

    $('noteImageRemove').addEventListener('click', () => {
      noteImage.file = null;
      noteImage.cleared = !!noteImage.url;
      $('noteImage').value = '';
      showNoteImage(null);
    });

    function openAdd() {
      editingId = null;
      $('editorTitle').textContent = t('addTitle');
      form.reset();
      resetNoteImage();
      setMsg('');
    }

    async function openEdit(id) {
      editingId = null;
      $('editorTitle').textContent = t('editTitle');
      form.reset();
      resetNoteImage();
      setMsg(t('loading'));
      const { data, error } = await db.from('entries').select('*').eq('id', id).single();
      if (error) return setMsg(t('error') + error.message, 'err');
      editingId = data.id;
      form.title.value = data.title;
      form.amount.value = data.amount;
      form.notes.value = data.notes || '';
      resetNoteImage(data.image_url);
      setMsg('');
    }

    const formatDate = (iso) => new Date(iso).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB');

    async function openView(id) {
      $('viewBody').classList.add('hidden');
      $('viewMsg').textContent = t('loading');
      $('viewMsg').className = 'msg';
      const { data, error } = await db.from('entries').select('*').eq('id', id).single();
      if (error) {
        $('viewMsg').textContent = t('error') + error.message;
        $('viewMsg').className = 'msg err';
        return;
      }
      $('vTitle').textContent = data.title;
      $('vDate').textContent = formatDate(data.created_at);
      $('vAmount').textContent = data.amount;
      $('vNotes').textContent = data.notes || '—';
      $('vImageLink').classList.toggle('hidden', !data.image_url);
      if (data.image_url) {
        $('vImage').src = data.image_url;
        $('vImageLink').href = data.image_url;
      }
      $('vEdit').href = '#/edit/' + data.id;
      $('viewMsg').textContent = '';
      $('viewBody').classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('save').disabled = true;
      setMsg(t('saving'));

      const row = {
        title: form.title.value.trim(),
        amount: Number(form.amount.value),
        notes: form.notes.value.trim() || null,
      };

      let newUrl = null;
      try {
        if (noteImage.file) {
          setMsg(t('uploading'));
          newUrl = row.image_url = await uploadImage(NOTE_IMAGES, noteImage.file, 1280, false);
          setMsg(t('saving'));
        } else if (noteImage.cleared) {
          row.image_url = null;
        }

        const { error } = editingId
          ? await db.from('entries').update(row).eq('id', editingId)
          : await db.from('entries').insert(row);

        if (error) {
          removeImage(NOTE_IMAGES, newUrl);
          setMsg(t('error') + error.message, 'err');
        } else {
          // The old image is no longer used once replaced or removed
          if (newUrl || noteImage.cleared) removeImage(NOTE_IMAGES, noteImage.url);
          setMsg(t(editingId ? 'updated' : 'saved'), 'ok');
          if (editingId) {
            resetNoteImage(newUrl || (noteImage.cleared ? null : noteImage.url));
          } else {
            form.reset();
            resetNoteImage();
          }
        }
      } catch (err) {
        setMsg(t('error') + err.message, 'err');
      }
      $('save').disabled = false;
    });

    // ---------- History ----------
    async function loadHistory() {
      const list = $('list');
      const msg = $('historyMsg');
      list.innerHTML = '';
      msg.textContent = t('loading');
      msg.className = 'msg';

      const { data, error } = await db.from('entries').select('*').order('created_at', { ascending: false });
      if (error) {
        msg.textContent = t('error') + error.message;
        msg.className = 'msg err';
        return;
      }
      msg.textContent = data.length ? '' : t('empty');

      for (const note of data) {
        const li = document.createElement('li');

        const open = document.createElement('a');
        open.className = 'open';
        open.href = '#/edit/' + note.id;
        const title = document.createElement('span');
        title.textContent = note.title;
        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = formatDate(note.created_at);
        if (note.image_url) {
          const thumb = document.createElement('img');
          thumb.className = 'thumb';
          thumb.src = note.image_url;
          thumb.alt = '';
          thumb.loading = 'lazy';
          title.prepend(thumb);
        }
        open.append(title, date);

        const view = document.createElement('a');
        view.className = 'icon-btn edit';
        view.href = '#/view/' + note.id;
        view.title = t('viewBtn');
        view.innerHTML = ICONS.eye;

        const edit = document.createElement('a');
        edit.className = 'icon-btn edit';
        edit.href = '#/edit/' + note.id;
        edit.title = t('editBtn');
        edit.innerHTML = ICONS.edit;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'icon-btn del';
        del.title = t('delBtn');
        del.innerHTML = ICONS.trash;
        del.addEventListener('click', () => deleteNote(note, li, del));

        li.append(open, view, edit, del);
        list.append(li);
      }
    }

    // First click arms the button ("Sure?") and returns false; second click within 3s returns true
    function confirmed(btn) {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = t('confirmDel');
        btn._timer = setTimeout(() => { btn.classList.remove('confirm'); btn.innerHTML = ICONS.trash; }, 3000);
        return false;
      }
      clearTimeout(btn._timer);
      return true;
    }

    async function deleteNote(note, li, btn) {
      if (!confirmed(btn)) return;
      btn.disabled = true;
      const { error } = await db.from('entries').delete().eq('id', note.id);
      if (error) {
        btn.disabled = false;
        $('historyMsg').textContent = t('error') + error.message;
        $('historyMsg').className = 'msg err';
        return;
      }
      removeImage(NOTE_IMAGES, note.image_url);
      li.remove();
      if (!$('list').children.length) $('historyMsg').textContent = t('empty');
    }

    // ---------- Users ----------
    function setUserMsg(text, cls = '') { $('userMsg').textContent = text; $('userMsg').className = 'msg ' + cls; }

    async function loadUsers() {
      const list = $('userList');
      list.innerHTML = '';
      setUserMsg(t('loading'));

      const { data, error } = await db.from('users').select('id, name, email, avatar_url').order('created_at');
      if (error) return setUserMsg(t('error') + error.message, 'err');
      setUserMsg('');

      const me = currentUser().email.toLowerCase();
      for (const u of data) {
        const row = document.createElement('div');
        row.className = 'user-row';

        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        fillAvatar(avatar, u);
        const name = displayName(u);

        const info = document.createElement('div');
        info.className = 'user-info';
        const strong = document.createElement('strong');
        strong.textContent = name;
        const small = document.createElement('small');
        small.textContent = u.email;
        info.append(strong, small);
        row.append(avatar, info);

        // The owner and the signed-in user can't be removed
        const tag = isOwner(u.email) ? 'owner' : u.email.toLowerCase() === me ? 'you' : null;
        if (tag) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = t(tag);
          row.append(badge);
        }

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.className = 'icon-btn edit';
        edit.title = t('editBtn');
        edit.innerHTML = ICONS.edit;
        edit.addEventListener('click', () => startEditUser(u));

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'icon-btn del';
        del.title = t('delBtn');
        del.innerHTML = ICONS.trash;
        del.disabled = !!tag;
        del.addEventListener('click', () => deleteUser(u, row, del));
        row.append(edit, del);

        list.append(row);
      }
    }

    async function deleteUser(u, row, btn) {
      if (!confirmed(btn)) return;
      btn.disabled = true;
      const { error } = await db.from('users').delete().eq('id', u.id);
      if (error) {
        btn.disabled = false;
        return setUserMsg(t('error') + error.message, 'err');
      }
      removeAvatarFile(u.avatar_url);
      row.remove();
    }

    // ---------- Images (Supabase Storage buckets "avatars" and "note-images") ----------
    const NOTE_IMAGES = 'note-images';

    // Shrinks to WebP before uploading: square=true center-crops to max×max,
    // otherwise the longest side is capped at max and the aspect ratio kept
    async function resizeImage(file, max, square) {
      const bmp = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (square) {
        const side = Math.min(bmp.width, bmp.height);
        canvas.width = canvas.height = max;
        ctx.drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, max, max);
      } else {
        const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      }
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', 0.85));
    }

    async function uploadImage(bucket, file, max, square) {
      const path = crypto.randomUUID() + '.webp';
      const blob = await resizeImage(file, max, square);
      const { error } = await db.storage.from(bucket).upload(path, blob, { contentType: 'image/webp' });
      if (error) throw error;
      return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    }

    function removeImage(bucket, url) {
      const path = url && url.split(`/${bucket}/`)[1];
      if (path) db.storage.from(bucket).remove([path]);
    }

    const uploadAvatar = (file) => uploadImage('avatars', file, 256, true);
    const removeAvatarFile = (url) => removeImage('avatars', url);

    // ---------- Add / edit user form ----------
    let editingUser = null; // the user being edited, or null when adding

    function showPhotoPreview(src) {
      const p = $('uPreview');
      if (!src) {
        p.innerHTML = ICONS.camera;
        p.classList.remove('has-photo');
        return;
      }
      const img = document.createElement('img');
      img.src = src;
      p.replaceChildren(img);
      p.classList.add('has-photo');
    }
    $('uPhoto').addEventListener('change', () => {
      const file = $('uPhoto').files[0];
      showPhotoPreview(file ? URL.createObjectURL(file) : editingUser && editingUser.avatar_url);
    });

    // Updates the form's title, button and password rules for add vs. edit mode
    function syncUserForm() {
      const editing = !!editingUser;
      $('userFormTitle').textContent = editing ? t('editUser') + ': ' + displayName(editingUser) : t('addUser');
      $('addUserBtn').textContent = t(editing ? 'save' : 'addUser');
      $('cancelEditUser').classList.toggle('hidden', !editing);
      $('uPassword').required = !editing;
      $('uPasswordLabel').classList.toggle('req', !editing);
      $('pwHint').classList.toggle('hidden', !editing);
      // The owner's email is fixed (it protects the account from being deleted)
      $('uEmail').readOnly = editing && isOwner(editingUser.email);
    }

    function startEditUser(u) {
      editingUser = u;
      $('userForm').reset();
      $('uName').value = u.name;
      $('uEmail').value = u.email;
      showPhotoPreview(u.avatar_url);
      setUserMsg('');
      syncUserForm();
      $('userFormTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('uName').focus({ preventScroll: true });
    }

    function stopEditUser() {
      editingUser = null;
      $('userForm').reset();
      showPhotoPreview(null);
      syncUserForm();
    }
    $('cancelEditUser').addEventListener('click', () => { stopEditUser(); setUserMsg(''); });

    $('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('addUserBtn').disabled = true;

      const editing = editingUser;
      const row = {
        name: $('uName').value.trim(),
        email: $('uEmail').value.trim().toLowerCase(),
      };
      if ($('uPassword').value) row.password = $('uPassword').value;

      let newPhoto = null;
      const file = $('uPhoto').files[0];
      try {
        if (file) {
          setUserMsg(t('uploading'));
          newPhoto = row.avatar_url = await uploadAvatar(file);
        }
        setUserMsg(t('saving'));
        const { error } = editing
          ? await db.from('users').update(row).eq('id', editing.id)
          : await db.from('users').insert(row);
        if (error) {
          removeAvatarFile(newPhoto);
          return setUserMsg(error.code === '23505' ? t('userExists') : t('error') + error.message, 'err');
        }

        if (editing) {
          if (newPhoto) removeAvatarFile(editing.avatar_url);
          // Keep the sidebar in sync when editing yourself
          if (editing.email.toLowerCase() === currentUser().email.toLowerCase()) {
            store.set('user', JSON.stringify({
              name: row.name, email: row.email, avatar_url: newPhoto || editing.avatar_url,
            }));
            updateWho();
          }
        }
        stopEditUser();
        await loadUsers();
        setUserMsg(t(editing ? 'userUpdated' : 'userAdded'), 'ok');
      } catch (err) {
        setUserMsg(t('error') + err.message, 'err');
      } finally {
        $('addUserBtn').disabled = false;
      }
    });
    stopEditUser();

    applyLang();
    applyTheme();
    render();
  </script>
</body>
</html>
