<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme/lang before paint to avoid a flash
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        if (theme) document.documentElement.dataset.theme = theme;
        const lang = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch {}
    })();
  </script>
  <style>
    :root {
      --bg: #f6f4ff;
      --bg-accent: radial-gradient(circle at 15% 0%, #ede9fe 0, transparent 45%), radial-gradient(circle at 90% 100%, #fce7f3 0, transparent 40%);
      --surface: #ffffff;
      --surface-hover: #f5f3ff;
      --text: #1e1b4b;
      --muted: #6b7280;
      --border: #e4e0f5;
      --input-bg: #fbfaff;
      --primary: #7c3aed;
      --primary-2: #db2777;
      --primary-soft: #ede9fe;
      --sidebar: #1e1b4b;
      --sidebar-text: #c7c2ea;
      --sidebar-hover: #2e2a63;
      --ok: #059669;
      --err: #dc2626;
      --err-soft: #fee2e2;
      --shadow: 0 10px 30px rgba(76, 29, 149, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0c1a;
        --bg-accent: radial-gradient(circle at 15% 0%, #2a1d52 0, transparent 45%), radial-gradient(circle at 90% 100%, #3b1530 0, transparent 40%);
        --surface: #17142a;
        --surface-hover: #221e3d;
        --text: #ece9ff;
        --muted: #9a95bd;
        --border: #2c2850;
        --input-bg: #110f22;
        --primary: #a78bfa;
        --primary-2: #f472b6;
        --primary-soft: #2a2350;
        --sidebar: #0a0915;
        --sidebar-text: #a9a3d1;
        --sidebar-hover: #1d1a36;
        --ok: #34d399;
        --err: #f87171;
        --err-soft: #3b1720;
        --shadow: 0 10px 30px rgba(0, 0, 0, .4);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0c1a;
      --bg-accent: radial-gradient(circle at 15% 0%, #2a1d52 0, transparent 45%), radial-gradient(circle at 90% 100%, #3b1530 0, transparent 40%);
      --surface: #17142a;
      --surface-hover: #221e3d;
      --text: #ece9ff;
      --muted: #9a95bd;
      --border: #2c2850;
      --input-bg: #110f22;
      --primary: #a78bfa;
      --primary-2: #f472b6;
      --primary-soft: #2a2350;
      --sidebar: #0a0915;
      --sidebar-text: #a9a3d1;
      --sidebar-hover: #1d1a36;
      --ok: #34d399;
      --err: #f87171;
      --err-soft: #3b1720;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg-accent), var(--bg);
      background-attachment: fixed;
      margin: 0; color: var(--text); min-height: 100vh;
      transition: background-color .2s, color .2s;
    }
    .hidden { display: none !important; }
    svg { width: 18px; height: 18px; flex-shrink: 0; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
    input, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 16px; font-family: inherit; background: var(--input-bg); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    textarea { min-height: 130px; resize: vertical; }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px; font-size: 17px; font-weight: 700; border: 0; border-radius: 10px; text-decoration: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff;
      transition: transform .1s, filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.block { width: 100%; margin-top: 22px; }
    .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost:hover { border-color: var(--primary); filter: none; }
    .msg { margin-top: 14px; text-align: center; min-height: 1.4em; }
    .ok { color: var(--ok); } .err { color: var(--err); }

    /* Toggles */
    .toggles { display: flex; gap: 8px; }
    .toggle {
      height: 38px; min-width: 38px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .toggle:hover { border-color: var(--primary); }

    .logo {
      width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 22px; font-weight: 700;
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    /* ---------- Landing ---------- */
    #landing { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    .nav { display: flex; align-items: center; gap: 12px; padding: 18px 0; }
    .nav .brand-name { font-weight: 800; font-size: 20px; }
    .nav .toggles { margin-inline-start: auto; }
    .nav .btn { padding: 8px 18px; font-size: 15px; }

    .hero { text-align: center; padding: 70px 0 50px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
      background: var(--primary-soft); color: var(--primary); margin-bottom: 20px;
    }
    .hero h2 { font-size: clamp(32px, 6vw, 56px); line-height: 1.25; margin: 0 0 18px; font-weight: 800; }
    .hero p { font-size: 19px; color: var(--muted); max-width: 600px; margin: 0 auto 32px; line-height: 1.8; }
    .hero .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .preview {
      max-width: 720px; margin: 50px auto 0; padding: 18px; border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 30px 60px -20px rgba(124, 58, 237, .45);
    }
    .preview-inner { background: var(--surface); border-radius: 12px; padding: 18px; text-align: start; }
    .preview-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; }
    .preview-row + .preview-row { border-top: 1px solid var(--border); }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .preview-row .bar { height: 10px; border-radius: 6px; background: var(--border); }
    .preview-row .num { margin-inline-start: auto; font-weight: 700; color: var(--muted); font-size: 14px; }

    .section-title { text-align: center; font-size: 30px; font-weight: 800; margin: 80px 0 10px; }
    .section-sub { text-align: center; color: var(--muted); margin: 0 0 36px; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .feature { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; transition: transform .2s, box-shadow .2s; }
    .feature:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .feature .icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; margin-bottom: 14px; }
    .feature .icon svg { width: 24px; height: 24px; }
    .feature h3 { margin: 0 0 6px; font-size: 18px; }
    .feature p { margin: 0; color: var(--muted); line-height: 1.7; }
    .c1 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .c2 { background: linear-gradient(135deg, #f472b6, #db2777); }
    .c3 { background: linear-gradient(135deg, #fbbf24, #f97316); }
    .c4 { background: linear-gradient(135deg, #2dd4bf, #0d9488); }
    .c5 { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .c6 { background: linear-gradient(135deg, #a3e635, #16a34a); }

    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; counter-reset: step; }
    .step { text-align: center; padding: 10px 16px; }
    .step .n {
      width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
      font-size: 22px; font-weight: 800; color: #fff;
    }
    .step h3 { margin: 0 0 6px; }
    .step p { margin: 0; color: var(--muted); }

    .cta {
      margin: 80px 0 40px; padding: 48px 24px; border-radius: 24px; text-align: center; color: #fff;
      background: linear-gradient(135deg, #7c3aed, #db2777 60%, #f97316);
    }
    .cta h2 { margin: 0 0 10px; font-size: 30px; font-weight: 800; }
    .cta p { margin: 0 0 24px; opacity: .9; }
    .cta .btn { background: #fff; color: #7c3aed; }
    footer { text-align: center; color: var(--muted); padding: 10px 0 30px; font-size: 14px; }

    /* ---------- Login ---------- */
    #login { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
    .login-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; }
    .back:hover { color: var(--primary); }
    [dir="rtl"] .flip { transform: scaleX(-1); }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand .logo { width: 56px; height: 56px; margin: 0 auto 10px; font-size: 26px; border-radius: 16px; }
    .brand p { margin: 0; color: var(--muted); }
    .persona-title { margin: 28px 0 10px; font-size: 14px; color: var(--muted); text-align: center; }
    .persona {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: start;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .persona:hover { border-color: var(--primary); background: var(--surface-hover); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-weight: 700; font-size: 18px;
    }
    .persona small { display: block; color: var(--muted); direction: ltr; text-align: start; }

    /* ---------- App ---------- */
    #app { display: flex; min-height: 100vh; }
    aside {
      width: 230px; background: var(--sidebar); color: var(--sidebar-text); padding: 20px 14px;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    .who { display: flex; align-items: center; gap: 10px; margin: 0 4px 20px; color: #fff; font-weight: 600; }
    .who .avatar { width: 36px; height: 36px; font-size: 15px; }
    aside nav a {
      display: flex; align-items: center; gap: 10px; color: var(--sidebar-text); text-decoration: none;
      padding: 10px 14px; border-radius: 10px; font-weight: 600; transition: background .15s;
    }
    aside nav { display: flex; flex-direction: column; gap: 6px; }
    aside nav a:hover { background: var(--sidebar-hover); color: #fff; }
    aside nav a.active { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
    .aside-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
    aside .toggle { background: var(--sidebar-hover); border-color: transparent; color: #fff; }
    .signout {
      display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 10px; font-weight: 700;
      background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .35); color: #fca5a5;
    }
    .signout:hover { background: rgba(248, 113, 113, .22); color: #fff; }
    main { flex: 1; padding: 32px 16px; min-width: 0; }
    main .card { max-width: 640px; margin: 0 auto; }

    #list { list-style: none; padding: 0; margin: 16px 0 0; }
    #list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    #list li + li { border-top: 1px solid var(--border); }
    #list .open {
      flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px;
      border-radius: 10px; text-decoration: none; font-weight: 600; transition: background .15s;
    }
    #list .open:hover { background: var(--surface-hover); color: var(--primary); }
    #list .open span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .date { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
    .icon-btn {
      height: 36px; min-width: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 700; font-size: 13px; text-decoration: none; transition: all .15s;
    }
    .icon-btn.edit:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
    .icon-btn.del:hover, .icon-btn.del.confirm { color: var(--err); border-color: var(--err); background: var(--err-soft); }
    .icon-btn:disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }

    /* Password eye */
    .pw-wrap { position: relative; direction: ltr; } /* password text is LTR, keep the eye on its trailing side */
    .pw-wrap input { padding-inline-end: 44px; }
    .pw-eye {
      position: absolute; top: 50%; inset-inline-end: 6px; transform: translateY(-50%);
      width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; color: var(--muted);
      display: grid; place-items: center;
    }
    .pw-eye:hover { color: var(--primary); background: var(--primary-soft); }

    /* Users */
    .user-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .user-form .full { grid-column: 1 / -1; }
    .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    .user-row + .user-row { border-top: 1px solid var(--border); }
    .user-row .avatar { width: 38px; height: 38px; font-size: 15px; }
    .user-info { flex: 1; min-width: 0; }
    .user-info strong { display: block; }
    .user-info small { display: block; color: var(--muted); direction: ltr; text-align: start; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
    .sub-title { margin: 28px 0 4px; font-size: 18px; }

    @media (max-width: 640px) {
      .nav .brand-name { display: none; }
      .hero { padding: 40px 0 30px; }
      #app { flex-direction: column; }
      aside { width: 100%; flex-direction: row; align-items: center; gap: 6px; padding: 10px 12px; }
      aside nav { flex-direction: row; gap: 4px; }
      aside nav a { padding: 9px 10px; }
      aside nav a [data-i18n] { display: none; }
      .who { display: none; }
      .aside-bottom { margin: 0; margin-inline-start: auto; flex-direction: row; gap: 6px; }
      .aside-bottom .toggles { gap: 6px; }
      .aside-bottom .toggle { padding: 0 8px; }
      .signout { height: 38px; width: 38px; padding: 0; }
      .signout [data-i18n] { display: none; }
      main { padding: 20px 16px; }
      .card { padding: 20px; }
      #list .date { display: none; }
      .user-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <template id="togglesTpl">
    <div class="toggles">
      <button type="button" class="toggle" data-action="lang"></button>
      <button type="button" class="toggle" data-action="theme" aria-label="Theme"></button>
    </div>
  </template>

  <!-- ================= Landing ================= -->
  <div id="landing" class="hidden">
    <header class="nav">
      <div class="logo">✎</div>
      <span class="brand-name" data-i18n="appName"></span>
      <div data-toggles></div>
      <a class="btn" data-enter href="#/login"></a>
    </header>

    <section class="hero">
      <div class="pill">✨ <span data-i18n="heroPill"></span></div>
      <h2><span data-i18n="heroTitle1"></span><br /><span class="gradient-text" data-i18n="heroTitle2"></span></h2>
      <p data-i18n="heroText"></p>
      <div class="actions">
        <a class="btn" data-enter href="#/login"></a>
        <a class="btn ghost" href="#features" data-i18n="learnMore"></a>
      </div>

      <div class="preview" aria-hidden="true">
        <div class="preview-inner">
          <div class="preview-row"><span class="dot c1"></span><span class="bar" style="width:45%"></span><span class="num">1,250</span></div>
          <div class="preview-row"><span class="dot c2"></span><span class="bar" style="width:62%"></span><span class="num">87</span></div>
          <div class="preview-row"><span class="dot c3"></span><span class="bar" style="width:35%"></span><span class="num">3,400</span></div>
          <div class="preview-row"><span class="dot c4"></span><span class="bar" style="width:52%"></span><span class="num">512</span></div>
        </div>
      </div>
    </section>

    <h2 class="section-title" id="features" data-i18n="featuresTitle"></h2>
    <p class="section-sub" data-i18n="featuresSub"></p>
    <div class="features">
      <div class="feature"><div class="icon c1" data-icon="bolt"></div><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
      <div class="feature"><div class="icon c2" data-icon="cloud"></div><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
      <div class="feature"><div class="icon c3" data-icon="edit"></div><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
      <div class="feature"><div class="icon c4" data-icon="globe"></div><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
      <div class="feature"><div class="icon c5" data-icon="moon"></div><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></div>
      <div class="feature"><div class="icon c6" data-icon="phone"></div><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></div>
    </div>

    <h2 class="section-title" data-i18n="stepsTitle"></h2>
    <p class="section-sub" data-i18n="stepsSub"></p>
    <div class="steps">
      <div class="step"><div class="n c1">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
      <div class="step"><div class="n c2">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
      <div class="step"><div class="n c3">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
    </div>

    <section class="cta">
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaText"></p>
      <a class="btn" data-enter href="#/login"></a>
    </section>

    <footer>© <span id="year"></span> · <span data-i18n="appName"></span> · <span data-i18n="footer"></span></footer>
  </div>

  <!-- ================= Login ================= -->
  <div id="login" class="hidden">
    <div class="login-top">
      <a class="back" href="#/"><span class="flip" data-icon="back"></span><span data-i18n="backHome"></span></a>
      <div data-toggles></div>
    </div>
    <div class="brand">
      <div class="logo">✎</div>
      <h1 data-i18n="appName"></h1>
      <p data-i18n="welcome"></p>
    </div>
    <div class="card">
      <form id="loginForm">
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" required dir="ltr" />
        <label for="password" data-i18n="password"></label>
        <input id="password" type="password" required dir="ltr" />
        <button type="submit" class="btn block" data-i18n="login"></button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </div>

    <div class="persona-title" data-i18n="personaHint"></div>
    <button type="button" class="persona" id="persona">
      <span class="avatar" data-i18n="initial"></span>
      <span>
        <strong data-i18n="userName"></strong>
        <small>bishoy.saber@gmail.com</small>
      </span>
    </button>
  </div>

  <!-- ================= App ================= -->
  <div id="app" class="hidden">
    <aside>
      <div class="who"><span class="avatar" id="whoInitial"></span><span id="whoName"></span></div>
      <nav>
        <a href="#/add" data-nav="add"><span data-icon="plus"></span><span data-i18n="addNote"></span></a>
        <a href="#/history" data-nav="history"><span data-icon="list"></span><span data-i18n="history"></span></a>
        <a href="#/users" data-nav="users"><span data-icon="users"></span><span data-i18n="users"></span></a>
      </nav>
      <div class="aside-bottom">
        <div data-toggles></div>
        <button type="button" class="signout" id="signout" data-i18n-title="signout"><span class="flip" data-icon="logout"></span><span data-i18n="signout"></span></button>
      </div>
    </aside>

    <main>
      <!-- Add / Edit -->
      <div id="editor" class="card">
        <h1 id="editorTitle"></h1>
        <form id="form">
          <label for="title" data-i18n="fTitle"></label>
          <input id="title" name="title" type="text" required />

          <label for="amount" data-i18n="fAmount"></label>
          <input id="amount" name="amount" type="number" step="any" required />

          <label for="notes" data-i18n="fNotes"></label>
          <textarea id="notes" name="notes"></textarea>

          <button type="submit" class="btn block" id="save" data-i18n="save"></button>
          <div id="msg" class="msg"></div>
        </form>
      </div>

      <!-- History -->
      <div id="history" class="card hidden">
        <h1 data-i18n="history"></h1>
        <ul id="list"></ul>
        <div id="historyMsg" class="msg"></div>
      </div>

      <!-- Users -->
      <div id="users" class="card hidden">
        <h1 data-i18n="users"></h1>
        <form id="userForm" class="user-form" autocomplete="off">
          <div>
            <label for="uName" data-i18n="uName"></label>
            <input id="uName" type="text" required />
          </div>
          <div>
            <label for="uEmail" data-i18n="email"></label>
            <input id="uEmail" type="email" required dir="ltr" autocomplete="off" />
          </div>
          <div class="full">
            <label for="uPassword" data-i18n="password"></label>
            <input id="uPassword" type="password" required minlength="6" dir="ltr" autocomplete="new-password" />
          </div>
          <div class="full">
            <button type="submit" class="btn block" id="addUserBtn" data-i18n="addUser"></button>
            <div id="userMsg" class="msg"></div>
          </div>
        </form>

        <h2 class="sub-title" data-i18n="allUsers"></h2>
        <div id="userList"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const USER = { email: 'bishoy.saber@gmail.com', password: '123456789' };
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      del(k) { try { localStorage.removeItem(k); } catch {} },
    };

    // ---------- Icons ----------
    const svg = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
    const ICONS = {
      moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
      sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
      edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
      trash: svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>'),
      plus: svg('<path d="M12 5v14M5 12h14"/>'),
      list: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
      logout: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'),
      back: svg('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
      bolt: svg('<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>'),
      cloud: svg('<path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>'),
      globe: svg('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>'),
      phone: svg('<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>'),
      users: svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'),
      eye: svg('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'),
      eyeOff: svg('<path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/>'),
    };

    // ---------- Translations ----------
    const I18N = {
      ar: {
        appName: 'ملاحظاتي', welcome: 'أهلاً بيك، سجّل دخولك', email: 'الإيميل', password: 'الباسورد',
        login: 'دخول', personaHint: 'اضغط على الاسم لملء البيانات', userName: 'بيشوي صابر', initial: 'ب',
        badLogin: 'الإيميل أو الباسورد غلط', addNote: 'إضافة ملاحظة', history: 'السجل', signout: 'تسجيل الخروج',
        addTitle: 'إضافة ملاحظة', editTitle: 'تعديل ملاحظة', fTitle: 'العنوان', fAmount: 'الرقم', fNotes: 'ملاحظات',
        save: 'حفظ', saving: 'جاري الحفظ...', saved: 'تم الحفظ ✓', updated: 'تم التعديل ✓', loading: 'جاري التحميل...',
        error: 'حصل خطأ: ', empty: 'مافيش ملاحظات لسه', otherLang: 'English',
        editBtn: 'تعديل', delBtn: 'مسح', confirmDel: 'متأكد؟',
        users: 'المستخدمين', uName: 'الاسم', addUser: 'إضافة مستخدم', allUsers: 'كل المستخدمين',
        userAdded: 'تم إضافة المستخدم ✓', userExists: 'الإيميل ده موجود قبل كده', owner: 'المالك', you: 'إنت',
        showPw: 'إظهار الباسورد', hidePw: 'إخفاء الباسورد',
        backHome: 'الرئيسية', startNow: 'ابدأ دلوقتي', openApp: 'افتح ملاحظاتك', learnMore: 'اعرف أكتر',
        heroPill: 'بسيط، سريع، ومتزامن', heroTitle1: 'كل أرقامك وأفكارك', heroTitle2: 'في مكان واحد',
        heroText: 'اكتب ملاحظاتك وأرقامك في ثواني، واحفظها في السحابة، وارجعلها وعدّلها في أي وقت ومن أي جهاز.',
        featuresTitle: 'ليه ملاحظاتي؟', featuresSub: 'كل اللي محتاجه، ومافيش أي حاجة زيادة',
        f1t: 'سريع جداً', f1d: 'اكتب ودوس حفظ، وخلاص. مافيش خطوات كتير ولا تعقيد.',
        f2t: 'محفوظ في السحابة', f2d: 'بياناتك متخزنة على Supabase، فمش هتضيع لو قفلت المتصفح.',
        f3t: 'عدّل في أي وقت', f3d: 'افتح أي ملاحظة من السجل وعدّلها أو امسحها بضغطة.',
        f4t: 'عربي وإنجليزي', f4d: 'بدّل اللغة بزرار واحد، والصفحة كلها بتتقلب معاك.',
        f5t: 'وضع ليلي', f5d: 'مريح للعين بالليل، وبيفتكر اختيارك.',
        f6t: 'على الموبايل', f6d: 'شغال كويس على أي شاشة، كبيرة أو صغيرة.',
        stepsTitle: 'إزاي بيشتغل؟', stepsSub: 'تلات خطوات بس',
        s1t: 'سجّل دخولك', s1d: 'اضغط على اسمك وادخل على طول.',
        s2t: 'اكتب ملاحظتك', s2d: 'عنوان، رقم، وشوية تفاصيل.',
        s3t: 'احفظ وارجعلها', s3d: 'هتلاقيها في السجل في أي وقت.',
        ctaTitle: 'جاهز تبدأ؟', ctaText: 'أول ملاحظة هتاخد منك أقل من دقيقة.', footer: 'معمول بحب ❤',
      },
      en: {
        appName: 'My Notes', welcome: 'Welcome back, please sign in', email: 'Email', password: 'Password',
        login: 'Login', personaHint: 'Click the name to fill in the details', userName: 'Bishoy Saber', initial: 'B',
        badLogin: 'Wrong email or password', addNote: 'Add note', history: 'History', signout: 'Sign out',
        addTitle: 'Add note', editTitle: 'Edit note', fTitle: 'Title', fAmount: 'Number', fNotes: 'Notes',
        save: 'Save', saving: 'Saving...', saved: 'Saved ✓', updated: 'Updated ✓', loading: 'Loading...',
        error: 'Error: ', empty: 'No notes yet', otherLang: 'عربي',
        editBtn: 'Edit', delBtn: 'Delete', confirmDel: 'Sure?',
        users: 'Users', uName: 'Name', addUser: 'Add user', allUsers: 'All users',
        userAdded: 'User added ✓', userExists: 'This email already exists', owner: 'Owner', you: 'You',
        showPw: 'Show password', hidePw: 'Hide password',
        backHome: 'Home', startNow: 'Get started', openApp: 'Open your notes', learnMore: 'Learn more',
        heroPill: 'Simple, fast and synced', heroTitle1: 'All your numbers and ideas', heroTitle2: 'in one place',
        heroText: 'Write down notes and numbers in seconds, save them to the cloud, and come back to edit them anytime, from any device.',
        featuresTitle: 'Why My Notes?', featuresSub: 'Everything you need, nothing you don\'t',
        f1t: 'Super fast', f1d: 'Type, hit save, done. No extra steps, no clutter.',
        f2t: 'Saved in the cloud', f2d: 'Your data lives on Supabase, so it\'s safe even if you close the browser.',
        f3t: 'Edit anytime', f3d: 'Open any note from History to edit or delete it in one click.',
        f4t: 'Arabic & English', f4d: 'Switch languages with one button — the whole layout flips with you.',
        f5t: 'Dark mode', f5d: 'Easy on the eyes at night, and it remembers your choice.',
        f6t: 'Mobile friendly', f6d: 'Works nicely on any screen, big or small.',
        stepsTitle: 'How it works', stepsSub: 'Just three steps',
        s1t: 'Sign in', s1d: 'Click your name and you\'re in.',
        s2t: 'Write a note', s2d: 'A title, a number, and some details.',
        s3t: 'Save & revisit', s3d: 'Find it in History whenever you need it.',
        ctaTitle: 'Ready to start?', ctaText: 'Your first note takes less than a minute.', footer: 'Made with ❤',
      },
    };
    let lang = store.get('lang') === 'en' ? 'en' : 'ar';
    const t = (key) => I18N[lang][key];

    function applyLang() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t('appName');
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
      document.querySelectorAll('[data-nav]').forEach((a) => { a.title = t(a.dataset.nav === 'add' ? 'addNote' : a.dataset.nav); });
      document.querySelectorAll('[data-action="lang"]').forEach((b) => { b.textContent = t('otherLang'); });
      document.querySelectorAll('[data-enter]').forEach((a) => { a.textContent = t(isLoggedIn() ? 'openApp' : 'startNow'); });
      document.querySelectorAll('.pw-eye').forEach(syncEye);
      $('editorTitle').textContent = t(editingId ? 'editTitle' : 'addTitle');
      updateWho();
      if ($('app').classList.contains('hidden')) return;
      if (!$('history').classList.contains('hidden')) loadHistory();
      if (!$('users').classList.contains('hidden')) loadUsers();
    }

    // ---------- Password eye ----------
    function syncEye(btn) {
      const shown = btn.previousElementSibling.type === 'text';
      btn.innerHTML = shown ? ICONS.eyeOff : ICONS.eye;
      btn.title = t(shown ? 'hidePw' : 'showPw');
      btn.setAttribute('aria-label', btn.title);
    }
    document.querySelectorAll('input[type="password"]').forEach((input) => {
      const wrap = document.createElement('div');
      wrap.className = 'pw-wrap';
      input.replaceWith(wrap);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-eye';
      btn.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        syncEye(btn);
      });
      wrap.append(input, btn);
    });

    // ---------- Theme ----------
    const isDark = () => {
      const set = document.documentElement.dataset.theme;
      return set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    };
    function applyTheme() {
      document.querySelectorAll('[data-action="theme"]').forEach((b) => { b.innerHTML = isDark() ? ICONS.sun : ICONS.moon; });
    }

    // Mount toggles + static icons
    document.querySelectorAll('[data-toggles]').forEach((slot) => slot.replaceWith($('togglesTpl').content.cloneNode(true)));
    document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = ICONS[el.dataset.icon]; });
    $('year').textContent = new Date().getFullYear();

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'lang') {
        lang = lang === 'ar' ? 'en' : 'ar';
        store.set('lang', lang);
        applyLang();
      } else if (btn.dataset.action === 'theme') {
        const next = isDark() ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        store.set('theme', next);
        applyTheme();
      }
    });

    // ---------- Login ----------
    const isLoggedIn = () => store.get('loggedIn') === '1';

    // Logged-in user as { name, email }; older sessions without it are the owner
    function currentUser() {
      try { return JSON.parse(store.get('user')) || { email: USER.email }; } catch { return { email: USER.email }; }
    }
    const isOwner = (email) => email.toLowerCase() === USER.email;
    const displayName = (u) => (isOwner(u.email) ? t('userName') : u.name || u.email);

    function updateWho() {
      const name = displayName(currentUser());
      $('whoName').textContent = name;
      $('whoInitial').textContent = name.charAt(0).toUpperCase();
    }

    $('persona').addEventListener('click', () => {
      $('email').value = USER.email;
      $('password').value = USER.password;
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      const btn = e.submitter;
      btn.disabled = true;

      const { data, error } = await db.from('users').select('name, email')
        .eq('email', email).eq('password', password).maybeSingle();
      btn.disabled = false;

      // Owner can always sign in, even if the users table is unreachable
      const user = data || (email === USER.email && password === USER.password ? { email } : null);
      if (user) {
        store.set('loggedIn', '1');
        store.set('user', JSON.stringify(user));
        $('loginMsg').textContent = '';
        updateWho();
        location.hash = '#/add';
      } else {
        $('loginMsg').textContent = error ? t('error') + error.message : t('badLogin');
        $('loginMsg').className = 'msg err';
      }
    });

    $('signout').addEventListener('click', () => {
      store.del('loggedIn');
      store.del('user');
      $('loginForm').reset();
      location.hash = '#/';
    });

    // ---------- Routing: #/ (landing), #/login, #/add, #/history, #/edit/<id>, #/users ----------
    let editingId = null;

    function show(view) {
      for (const v of ['landing', 'login', 'app']) $(v).classList.toggle('hidden', v !== view);
      window.scrollTo(0, 0);
    }

    function render() {
      const [, page, id] = location.hash.split('/');
      const loggedIn = isLoggedIn();
      document.querySelectorAll('[data-enter]').forEach((a) => {
        a.href = loggedIn ? '#/add' : '#/login';
        a.textContent = t(loggedIn ? 'openApp' : 'startNow');
      });

      if (!page) return show('landing');
      if (page === 'login') return loggedIn ? (location.hash = '#/add') : show('login');
      if (!loggedIn) return (location.hash = '#/login');

      show('app');
      const section = page === 'history' || page === 'users' ? page : 'editor';
      for (const s of ['editor', 'history', 'users']) $(s).classList.toggle('hidden', s !== section);
      const activeNav = section === 'editor' ? (page === 'edit' ? 'history' : 'add') : section;
      document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === activeNav));

      if (section === 'history') loadHistory();
      else if (section === 'users') loadUsers();
      else if (page === 'edit' && id) openEdit(id);
      else openAdd();
    }

    window.addEventListener('hashchange', (e) => {
      // In-page anchor links like #features: scroll, don't route
      if (location.hash && !location.hash.startsWith('#/')) {
        const target = document.querySelector(location.hash);
        history.replaceState(null, '', new URL(e.oldURL).hash || '#/');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      render();
    });

    // ---------- Add / Edit ----------
    const form = $('form');

    function setMsg(text, cls = '') { $('msg').textContent = text; $('msg').className = 'msg ' + cls; }

    function openAdd() {
      editingId = null;
      $('editorTitle').textContent = t('addTitle');
      form.reset();
      setMsg('');
    }

    async function openEdit(id) {
      editingId = null;
      $('editorTitle').textContent = t('editTitle');
      form.reset();
      setMsg(t('loading'));
      const { data, error } = await db.from('entries').select('*').eq('id', id).single();
      if (error) return setMsg(t('error') + error.message, 'err');
      editingId = data.id;
      form.title.value = data.title;
      form.amount.value = data.amount;
      form.notes.value = data.notes || '';
      setMsg('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('save').disabled = true;
      setMsg(t('saving'));

      const row = {
        title: form.title.value.trim(),
        amount: Number(form.amount.value),
        notes: form.notes.value.trim() || null,
      };

      const { error } = editingId
        ? await db.from('entries').update(row).eq('id', editingId)
        : await db.from('entries').insert(row);

      if (error) {
        setMsg(t('error') + error.message, 'err');
      } else {
        setMsg(t(editingId ? 'updated' : 'saved'), 'ok');
        if (!editingId) form.reset();
      }
      $('save').disabled = false;
    });

    // ---------- History ----------
    async function loadHistory() {
      const list = $('list');
      const msg = $('historyMsg');
      list.innerHTML = '';
      msg.textContent = t('loading');
      msg.className = 'msg';

      const { data, error } = await db.from('entries').select('id, title, created_at').order('created_at', { ascending: false });
      if (error) {
        msg.textContent = t('error') + error.message;
        msg.className = 'msg err';
        return;
      }
      msg.textContent = data.length ? '' : t('empty');

      for (const note of data) {
        const li = document.createElement('li');

        const open = document.createElement('a');
        open.className = 'open';
        open.href = '#/edit/' + note.id;
        const title = document.createElement('span');
        title.textContent = note.title;
        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = new Date(note.created_at).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB');
        open.append(title, date);

        const edit = document.createElement('a');
        edit.className = 'icon-btn edit';
        edit.href = '#/edit/' + note.id;
        edit.title = t('editBtn');
        edit.innerHTML = ICONS.edit;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'icon-btn del';
        del.title = t('delBtn');
        del.innerHTML = ICONS.trash;
        del.addEventListener('click', () => deleteNote(note.id, li, del));

        li.append(open, edit, del);
        list.append(li);
      }
    }

    // First click arms the button ("Sure?") and returns false; second click within 3s returns true
    function confirmed(btn) {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = t('confirmDel');
        btn._timer = setTimeout(() => { btn.classList.remove('confirm'); btn.innerHTML = ICONS.trash; }, 3000);
        return false;
      }
      clearTimeout(btn._timer);
      return true;
    }

    async function deleteNote(id, li, btn) {
      if (!confirmed(btn)) return;
      btn.disabled = true;
      const { error } = await db.from('entries').delete().eq('id', id);
      if (error) {
        btn.disabled = false;
        $('historyMsg').textContent = t('error') + error.message;
        $('historyMsg').className = 'msg err';
        return;
      }
      li.remove();
      if (!$('list').children.length) $('historyMsg').textContent = t('empty');
    }

    // ---------- Users ----------
    function setUserMsg(text, cls = '') { $('userMsg').textContent = text; $('userMsg').className = 'msg ' + cls; }

    async function loadUsers() {
      const list = $('userList');
      list.innerHTML = '';
      setUserMsg(t('loading'));

      const { data, error } = await db.from('users').select('id, name, email').order('created_at');
      if (error) return setUserMsg(t('error') + error.message, 'err');
      setUserMsg('');

      const me = currentUser().email.toLowerCase();
      for (const u of data) {
        const row = document.createElement('div');
        row.className = 'user-row';

        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        const name = displayName(u);
        avatar.textContent = name.charAt(0).toUpperCase();

        const info = document.createElement('div');
        info.className = 'user-info';
        const strong = document.createElement('strong');
        strong.textContent = name;
        const small = document.createElement('small');
        small.textContent = u.email;
        info.append(strong, small);
        row.append(avatar, info);

        // The owner and the signed-in user can't be removed
        const tag = isOwner(u.email) ? 'owner' : u.email.toLowerCase() === me ? 'you' : null;
        if (tag) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = t(tag);
          row.append(badge);
        }

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'icon-btn del';
        del.title = t('delBtn');
        del.innerHTML = ICONS.trash;
        del.disabled = !!tag;
        del.addEventListener('click', () => deleteUser(u.id, row, del));
        row.append(del);

        list.append(row);
      }
    }

    async function deleteUser(id, row, btn) {
      if (!confirmed(btn)) return;
      btn.disabled = true;
      const { error } = await db.from('users').delete().eq('id', id);
      if (error) {
        btn.disabled = false;
        return setUserMsg(t('error') + error.message, 'err');
      }
      row.remove();
    }

    $('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('addUserBtn').disabled = true;
      setUserMsg(t('saving'));

      const { error } = await db.from('users').insert({
        name: $('uName').value.trim(),
        email: $('uEmail').value.trim().toLowerCase(),
        password: $('uPassword').value,
      });
      $('addUserBtn').disabled = false;

      if (error) return setUserMsg(error.code === '23505' ? t('userExists') : t('error') + error.message, 'err');
      e.target.reset();
      await loadUsers();
      setUserMsg(t('userAdded'), 'ok');
    });

    applyLang();
    applyTheme();
    render();
  </script>
</body>
</html>
